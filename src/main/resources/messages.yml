############################################################
# +------------------------------------------------------+ #
# |                        General                       | #
# +------------------------------------------------------+ #
############################################################

# Please do not change this value as it may cause the file to be reset.
# Default: "1.6"
messages-version: "1.6"

# Change the prefix sent at the beginning of most sent messages.
# TIP: Use {prefix} in any message to include the prefix.
prefix: "<dark_gray>[<gold><bold>EXG<dark_gray>]<gray><reset>"

############################################################
# +------------------------------------------------------+ #
# |                   Admin Messages                     | #
# +------------------------------------------------------+ #
############################################################

admin:

  filesReloading: "{prefix} <yellow>The files are being reloaded...<reset>"
  filesReloaded: "{prefix} <yellow>The files have been reloaded. Please check the console if you encounter any errors.<reset>"

  # Placeholders available: {currentVersion}, {latestVersion}
  alertUpdateAvailable: "{prefix} <yellow>An update is available for EssentialsX-GUI. <gold>Please check the console for more information.<reset>"

  databaseReloading: "{prefix} <yellow>The database is being reloaded...<reset>"
  # Placeholders available: {newStorageType}
  databaseReloaded: "{prefix} <yellow>The database has been reloaded. The storage type is <white>{newStorageType}<yellow>.<reset>"

############################################################
# +------------------------------------------------------+ #
# |                   Error Messages                     | #
# +------------------------------------------------------+ #
############################################################

errors:

  invalidMaterial: "<red>The material name is invalid.<reset>"
  invalidNumber: "<red>The input is not a valid number.<reset>"
  # Placeholders available: {min}, {max}
  lengthLimit: "<red>The input should be between <white>{min}<red> and <white>{max} <red>characters long.<reset>"


  # Placeholders available: {argument}
  argumentNotFound: "{prefix} <red>The argument <white>{argument} <red>was not found.<reset>"
  noPermission: "{prefix} <red>You do not have permission to perform this action.<reset>"
  onlyForPlayers: "{prefix} <red>This command can only be executed by players.<reset>"
  playerNotFound: "{prefix} <red>The specified player was not found.<reset>"

  homeDeleteError: "<red>An error occurred while deleting the home. Please contact the server administrator.<reset>"
  homeNameAlreadyExists: "<red>A home with this name already exists.<reset>"
  homeLimitReached: "<red>You have reached the maximum number of homes allowed.<reset>"
  noHomeFound: "<red>No home found with that name.<reset>"
  itemCantBeAir: "<red>The item cannot be air. Please take an item in your hand and try again.<reset>"

  kitNameAlreadyExists: "<red>A kit with this name already exists.<reset>"
  noKitFound: "<red>No kit found with that name.<reset>"

  warpCreationError: "<red>An error occurred while creating the warp. Please contact the server administrator.<reset>"
  warpDeleteError: "<red>An error occurred while deleting the warp. Please contact the server administrator.<reset>"
  noWarpFound: "<red>No warp found with that name.<reset>"

