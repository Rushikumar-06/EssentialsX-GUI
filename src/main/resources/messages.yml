############################################################
# +------------------------------------------------------+ #
# |                      Information                     | #
# +------------------------------------------------------+ #
############################################################

# This is the messages file for EssentialsX-GUI.

# If you need help with the configuration of the plugin,
# you can join our discord server at: https://discord.gg/fSzK79TAYf

# For more translations,
# check our Wiki at: https://sniper-tvmc.gitbook.io/essentialsx-gui/configuration/messages

# Note about PlaceholderAPI :
#   EssentialsX-GUI supports PlaceholderAPI placeholders in messages.
#   You can use any PlaceholderAPI placeholder in the messages, and they will be parsed correctly.
#   For example, you can use %player_name% to display the player's name in a message.

#   A list of officially supported placeholders can be found on the PlaceholderAPI wiki:
#   - https://wiki.placeholderapi.com/users/placeholder-list/minecraft/
#
#   ⚠️ This is different from the plugin's "placeholders," which are only available in certain messages, when specified.
#      The plugin's “placeholders” are listed in the comments above the relevant messages and should be used with the syntax {placeholderName}.

############################################################
# +------------------------------------------------------+ #
# |                        General                       | #
# +------------------------------------------------------+ #
############################################################

# Please do not change this value as it may cause the file to be reset.
# Default: "1.6"
messages-version: "1.6"

# Change the prefix sent at the beginning of most sent messages.
# TIP: Use {prefix} in any message to include the prefix.
prefix: "<dark_gray>[<gradient:#f59e0b:#fde68a><bold>EXG</bold></gradient><dark_gray>]<gray><reset>"

############################################################
# +------------------------------------------------------+ #
# |                   Admin Messages                     | #
# +------------------------------------------------------+ #
############################################################

admin:

  filesReloading: "{prefix} <gradient:#f59e0b:#fde68a>Reloading plugin files...</gradient><reset>"
  filesReloaded: "{prefix} <gradient:#22c55e:#14b8a6>Files reloaded successfully.</gradient> <gray>Check the console if anything looks wrong.<reset>"

  # Placeholders available: {currentVersion}, {latestVersion}
  alertUpdateAvailable: "{prefix} <gradient:#f59e0b:#fde68a>An update is available for EssentialsX-GUI.</gradient> <gray>Check the console for details.<reset>"

  databaseReloading: "{prefix} <gradient:#f59e0b:#fde68a>Reloading database...</gradient><reset>"
  # Placeholders available: {newStorageType}
  databaseReloaded: "{prefix} <gradient:#22c55e:#14b8a6>Database reloaded.</gradient> <gray>Storage: <white>{newStorageType}<reset>"

############################################################
# +------------------------------------------------------+ #
# |                   Error Messages                     | #
# +------------------------------------------------------+ #
############################################################

errors:

  invalidMaterial: "<red>The material name is invalid.<reset>"
  invalidNumber: "<red>The input is not a valid number.<reset>"
  invalidFormat: "<red>The input format is invalid. You must use MiniMessage formatting.<reset>"
  # Placeholders available: {min}, {max}
  lengthLimit: "<red>The input should be between <white>{min}<red> and <white>{max} <red>characters long.<reset>"


  # Placeholders available: {argument}
  argumentNotFound: "{prefix} <red>The argument <white>{argument} <red>was not found.<reset>"
  noPermission: "{prefix} <red>You do not have permission to perform this action.<reset>"
  onlyForPlayers: "{prefix} <red>This command can only be executed by players.<reset>"
  playerNotFound: "{prefix} <red>The specified player was not found.<reset>"

  homeDeleteError: "<red>An error occurred while deleting the home. Please contact the server administrator.<reset>"
  homeNameAlreadyExists: "<red>A home with this name already exists.<reset>"
  homeLimitReached: "<red>You have reached the maximum number of homes allowed.<reset>"
  noHomeFound: "<red>No home found with that name.<reset>"
  itemCantBeAir: "<red>The item cannot be air. Please take an item in your hand and try again.<reset>"

  kitNameAlreadyExists: "<red>A kit with this name already exists.<reset>"
  noKitFound: "<red>No kit found with that name.<reset>"

  warpCreationError: "<red>An error occurred while creating the warp. Please contact the server administrator.<reset>"
  warpDeleteError: "<red>An error occurred while deleting the warp. Please contact the server administrator.<reset>"
  noWarpFound: "<red>No warp found with that name.<reset>"

